name: Original sci-fi frontier exact-cell independent qualification
on:
  push:
    branches:
      - original/scifi-frontier-wide/morrow-array-split-phasewell-261119
    paths:
      - 'cybersand-canvases/2048x1024/original-scifi-frontier-wide-morrow-array-split-phasewell-261119/**'
      - '.github/workflows/original-scifi-frontier-wide.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exact-map:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: R6 scoped one-shot genuine material-cell artifact publication
        run: |
          set -euo pipefail
          D="cybersand-canvases/2048x1024/original-scifi-frontier-wide-morrow-array-split-phasewell-261119"
          node "$D/build.cjs" --verify | tee /tmp/morrow-r6-author.json
          node "$D/verify-independent.cjs" | tee /tmp/morrow-r6-independent.json
          node -e 'const r=require("./"+process.argv[1]+"/receipt.json");if(r.clearance.some(x=>x.reached!==20)||r.rectangles>32768||r.setup_bytes>1048576)process.exit(1)' "$D"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$D/setup-morrow-array.json" "$D/receipt.json" "$D/"*.png
          if ! git diff --cached --quiet; then
            git commit -m "R6: publish canonically rebuilt zero-detached material cells"
            git push origin HEAD:refs/heads/original/scifi-frontier-wide/morrow-array-split-phasewell-261119
          fi
      - name: Independent actual-serialized material grid, named flight and PNG pixel audit
        run: |
          set -euo pipefail
          D="cybersand-canvases/2048x1024/original-scifi-frontier-wide-morrow-array-split-phasewell-261119"
          node "$D/verify-independent.cjs" | tee /tmp/morrow-independent.json
      - name: Deterministic builder replay and artifact parity
        run: |
          set -euo pipefail
          D="cybersand-canvases/2048x1024/original-scifi-frontier-wide-morrow-array-split-phasewell-261119"
          node "$D/build.cjs" --verify | tee /tmp/morrow-replay.json
          git diff --exit-code -- "$D"
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morrow-array-independent-static
          path: |
            /tmp/morrow-independent.json
            /tmp/morrow-replay.json
            cybersand-canvases/2048x1024/original-scifi-frontier-wide-morrow-array-split-phasewell-261119/
          if-no-files-found: ignore

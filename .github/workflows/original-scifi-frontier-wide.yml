name: Original sci-fi frontier R3 material-cell publication (temporary write gate)
on:
  push:
    branches:
      - original/scifi-frontier-wide/morrow-array-split-phasewell-261119
    paths:
      - 'cybersand-canvases/2048x1024/original-scifi-frontier-wide-morrow-array-split-phasewell-261119/**'
      - '.github/workflows/original-scifi-frontier-wide.yml'
permissions:
  contents: write
jobs:
  exact-map:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild physical grid, Setup-v2 and authentic indexed PNGs
        run: |
          set -euo pipefail
          D="cybersand-canvases/2048x1024/original-scifi-frontier-wide-morrow-array-split-phasewell-261119"
          node "$D/build.cjs" --verify | tee /tmp/morrow-replay.json
      - name: Independent serialized-cell, Midge and exact-PNG verification
        run: |
          set -euo pipefail
          D="cybersand-canvases/2048x1024/original-scifi-frontier-wide-morrow-array-split-phasewell-261119"
          node "$D/verify-independent.cjs" | tee /tmp/morrow-independent.json
      - name: Commit only regenerated source-matched cell artifacts
        run: |
          set -euo pipefail
          D="cybersand-canvases/2048x1024/original-scifi-frontier-wide-morrow-array-split-phasewell-261119"
          git add -- "$D/setup-morrow-array.json" "$D/receipt.json" "$D/"*.png
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "R3: publish exact regenerated material-grid and PNG evidence"
            git push origin "HEAD:$GITHUB_REF"
          fi
      - name: Retain R3 qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morrow-r3-static
          path: |
            /tmp/morrow-replay.json
            /tmp/morrow-independent.json
          if-no-files-found: ignore

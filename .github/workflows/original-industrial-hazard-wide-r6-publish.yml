name: Hazard R6 TEMP material-grid publisher (remove after committed evidence)
on:
  push:
    branches:
      - 'original/industrial-hazard-wide/pyrewater-ashlight-dual-261119'
permissions:
  contents: write
jobs:
  build-and-commit-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build two authentic full material worlds and indexed PNGs
        run: node tools/original-industrial-hazard-wide/build.cjs
      - name: Requalify full planes, all exact centres and 1:1 pixels
        run: node tools/original-industrial-hazard-wide/verify-independent.cjs
      - name: Commit real material artifacts (not mocks) to lane-owned branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cybersand-canvases/2048x1024/original-industrial-hazard-wide-pyrewater-quarantine-ring/
          git add cybersand-canvases/2048x1024/original-industrial-hazard-wide-ashlight-counterflow-foundry/
          if git diff --cached --quiet; then
            echo "No generated cell drift"
          else
            git commit -m "hazard R6: publish two deterministic qualified material-cell worlds"
            git push origin HEAD:refs/heads/original/industrial-hazard-wide/pyrewater-ashlight-dual-261119
          fi

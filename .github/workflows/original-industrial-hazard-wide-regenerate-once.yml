name: One-shot hazard map asset regeneration (lane-owned)
on:
  push:
    branches:
      - original/industrial-hazard-wide/pyrewater-ashlight-dual-261119
permissions:
  contents: write
concurrency:
  group: industrial-hazard-wide-publish-once
  cancel-in-progress: false
jobs:
  publish-generated-cells:
    if: github.ref == 'refs/heads/original/industrial-hazard-wide/pyrewater-ashlight-dual-261119'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate genuine Setup-v2 cells, full PNGs and 1:1 crops
        run: node tools/original-industrial-hazard-wide/build.cjs
      - name: Independent PNG, full-plane, actor-route and containment checks
        run: |
          node tools/original-industrial-hazard-wide/build.cjs --verify
          node tools/original-industrial-hazard-wide/verify-independent.cjs
      - name: Commit ONLY this lane's regenerated artifacts
        run: |
          set -euo pipefail
          folder='cybersand-canvases/2048x1024'
          git add "$folder/original-industrial-hazard-wide-pyrewater-quarantine-ring" "$folder/original-industrial-hazard-wide-ashlight-counterflow-foundry"
          if git diff --cached --quiet; then
            echo "No content changed; generator output already published"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'R3: publish independently verified emergency reactor bypass material grids and PNG crops'
          git push origin HEAD:refs/heads/original/industrial-hazard-wide/pyrewater-ashlight-dual-261119

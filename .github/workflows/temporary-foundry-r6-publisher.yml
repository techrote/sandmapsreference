name: TEMP Foundry R6 exact-source material artifact publisher
on:
  push:
    branches:
      - original/industrial-foundry-wide/long-pour-steelworks-261119
permissions:
  contents: write
jobs:
  publish-owned-branch-only:
    if: github.repository == 'techrote/sandmapsreference' && github.ref == 'refs/heads/original/industrial-foundry-wide/long-pour-steelworks-261119' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render authentic source material grid, setup and PNGs
        run: node tools/original-industrial-foundry-wide/build.cjs
      - name: Independently replay complete grid, image parity, routes and reactive containment
        run: node tools/original-industrial-foundry-wide/verify-independent.cjs
      - name: Verify exact regenerability and safe diff
        run: |
          node tools/original-industrial-foundry-wide/build.cjs --verify
          node tools/original-industrial-foundry-wide/verify-independent.cjs --verify
          git diff --check
      - name: Publish only generated lane outputs when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- cybersand-canvases/2048x1024/original-industrial-foundry-wide-long-pour-steelworks/
          if git diff --cached --quiet; then
            echo 'Lane output already current; nothing to publish'
          else
            git commit -m 'foundry R6: regenerate exact material-cell map and verified artifacts'
            git push origin HEAD:refs/heads/original/industrial-foundry-wide/long-pour-steelworks-261119
          fi

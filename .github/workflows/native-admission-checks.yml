name: Native admission source checks

on:
  pull_request:
    paths:
      - tools/native_admission/**
      - tests/native_admission/**
      - .github/workflows/native-admission*.yml
      - docs/native-admission/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-admission-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Native admission deterministic integrity checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run deterministic negative and integrity tests
        run: python3 -m unittest discover -s tests/native_admission -p 'test_*.py' -v

name: Export original landscape canvas bundle
on:
  push:
    branches:
      - 'artifact/original-landscapes-bundle-20261119'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read original PR 17 exact source
        uses: actions/checkout@v4
        with:
          repository: techrote/sandmapsreference
          ref: 189722d05743e81a8c10fe686daa96499ed6c5ae
          path: src/pr17
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            cybersand-canvases/2048x1024/original-racing-wide-thunderclap-switchyard-261118
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Read original PR 20 exact source
        uses: actions/checkout@v4
        with:
          repository: techrote/sandmapsreference
          ref: 47e019a299d8bec1c72301a8265ef3e99c0faaad
          path: src/pr20
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            cybersand-canvases/2048x1024/original-scifi-frontier-wide-morrow-array-split-phasewell-261119
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Read original PR 21 exact source
        uses: actions/checkout@v4
        with:
          repository: techrote/sandmapsreference
          ref: 6f5ffd5212710988c2b3defa83fb842cdf07ff36
          path: src/pr21
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            cybersand-canvases/2048x1024/original-industrial-transit-wide-cinderwake-dual-harbour-interchange-261119
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Read original PR 22 exact source
        uses: actions/checkout@v4
        with:
          repository: techrote/sandmapsreference
          ref: b0d1e5216aabb9b5e009e599ffbffcec6fd8a657
          path: src/pr22
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            cybersand-canvases/2048x1024/original-scifi-biomech-wide-graftloom-slipway-261119
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Read original PR 23 exact source
        uses: actions/checkout@v4
        with:
          repository: techrote/sandmapsreference
          ref: bb6f05ee4fbb52c536e01f69849a01c313eca42e
          path: src/pr23
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            cybersand-canvases/2048x1024/original-industrial-hazard-wide-pyrewater-quarantine-ring
            cybersand-canvases/2048x1024/original-industrial-hazard-wide-ashlight-counterflow-foundry
            tools/original-industrial-hazard-wide
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Read original PR 24 exact source
        uses: actions/checkout@v4
        with:
          repository: techrote/sandmapsreference
          ref: 04d47c9ae0c0de6132aa1b96fb0c082b7ef2da95
          path: src/pr24
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            cybersand-canvases/2048x1024/original-megastructure-wide-meridian-scar-261119
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Read original PR 25 exact source
        uses: actions/checkout@v4
        with:
          repository: techrote/sandmapsreference
          ref: 9d38064137c1c3be1073d204967e658e8e2235a6
          path: src/pr25
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            cybersand-canvases/2048x1024/original-industrial-foundry-wide-long-pour-steelworks
            tools/original-industrial-foundry-wide
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Assemble standalone eight-map directory
        shell: bash
        run: |
          set -euo pipefail
          O="out/CyberSand-Original-Landscapes-2026-11-19"
          mkdir -p "$O/maps" "$O/tools"
          test "$(git -C src/pr17 rev-parse HEAD)" = "189722d05743e81a8c10fe686daa96499ed6c5ae"
          test -f "src/pr17/cybersand-canvases/2048x1024/original-racing-wide-thunderclap-switchyard-261118/overview.png"
          cp -a "src/pr17/cybersand-canvases/2048x1024/original-racing-wide-thunderclap-switchyard-261118" "$O/maps/"
          test "$(git -C src/pr20 rev-parse HEAD)" = "47e019a299d8bec1c72301a8265ef3e99c0faaad"
          test -f "src/pr20/cybersand-canvases/2048x1024/original-scifi-frontier-wide-morrow-array-split-phasewell-261119/overview.png"
          cp -a "src/pr20/cybersand-canvases/2048x1024/original-scifi-frontier-wide-morrow-array-split-phasewell-261119" "$O/maps/"
          test "$(git -C src/pr21 rev-parse HEAD)" = "6f5ffd5212710988c2b3defa83fb842cdf07ff36"
          test -f "src/pr21/cybersand-canvases/2048x1024/original-industrial-transit-wide-cinderwake-dual-harbour-interchange-261119/overview.png"
          cp -a "src/pr21/cybersand-canvases/2048x1024/original-industrial-transit-wide-cinderwake-dual-harbour-interchange-261119" "$O/maps/"
          test "$(git -C src/pr22 rev-parse HEAD)" = "b0d1e5216aabb9b5e009e599ffbffcec6fd8a657"
          test -f "src/pr22/cybersand-canvases/2048x1024/original-scifi-biomech-wide-graftloom-slipway-261119/overview.png"
          cp -a "src/pr22/cybersand-canvases/2048x1024/original-scifi-biomech-wide-graftloom-slipway-261119" "$O/maps/"
          test "$(git -C src/pr23 rev-parse HEAD)" = "bb6f05ee4fbb52c536e01f69849a01c313eca42e"
          test -f "src/pr23/cybersand-canvases/2048x1024/original-industrial-hazard-wide-pyrewater-quarantine-ring/overview.png"
          cp -a "src/pr23/cybersand-canvases/2048x1024/original-industrial-hazard-wide-pyrewater-quarantine-ring" "$O/maps/"
          test -f "src/pr23/cybersand-canvases/2048x1024/original-industrial-hazard-wide-ashlight-counterflow-foundry/overview.png"
          cp -a "src/pr23/cybersand-canvases/2048x1024/original-industrial-hazard-wide-ashlight-counterflow-foundry" "$O/maps/"
          cp -a "src/pr23/tools/original-industrial-hazard-wide" "$O/tools/"
          test "$(git -C src/pr24 rev-parse HEAD)" = "04d47c9ae0c0de6132aa1b96fb0c082b7ef2da95"
          test -f "src/pr24/cybersand-canvases/2048x1024/original-megastructure-wide-meridian-scar-261119/overview.png"
          cp -a "src/pr24/cybersand-canvases/2048x1024/original-megastructure-wide-meridian-scar-261119" "$O/maps/"
          test "$(git -C src/pr25 rev-parse HEAD)" = "9d38064137c1c3be1073d204967e658e8e2235a6"
          test -f "src/pr25/cybersand-canvases/2048x1024/original-industrial-foundry-wide-long-pour-steelworks/overview.png"
          cp -a "src/pr25/cybersand-canvases/2048x1024/original-industrial-foundry-wide-long-pour-steelworks" "$O/maps/"
          cp -a "src/pr25/tools/original-industrial-foundry-wide" "$O/tools/"
          cat > "$O/README.txt" <<'BUNDLE_README_EOF'
          CYBERSAND ORIGINAL LANDSCAPES — EXACT-HEAD SOURCE BUNDLE
          Assembled: 19 November 2026
          Repository: https://github.com/techrote/sandmapsreference
          8 independent original sci-fi/industrial 2048x1024 material-cell maps from 7 unmerged Draft/HOLD PRs.
          
          Each maps/ directory contains an original committed Setup-v2 JSON, real material-cell overview PNG, district PNG crops, a README, and qualification/receipt information. Builder and verification source is included in map directories when held there, otherwise under tools/. No engine binary is included.
          
          Map                                  PR      Exact committed source SHA
          Thunderclap Switchyard               17      189722d05743e81a8c10fe686daa96499ed6c5ae
          Morrow Array                          20      47e019a299d8bec1c72301a8265ef3e99c0faaad
          Cinderwake Dual Harbour              21      6f5ffd5212710988c2b3defa83fb842cdf07ff36
          Graftloom Slipway                     22      b0d1e5216aabb9b5e009e599ffbffcec6fd8a657
          Pyrewater Quarantine Ring            23      bb6f05ee4fbb52c536e01f69849a01c313eca42e
          Ashlight Counterflow Foundry         23      bb6f05ee4fbb52c536e01f69849a01c313eca42e
          The Meridian Scar                    24      04d47c9ae0c0de6132aa1b96fb0c082b7ef2da95
          The Long Pour                        25      9d38064137c1c3be1073d204967e658e8e2235a6
          
          Exact PR links: https://github.com/techrote/sandmapsreference/pull/{17,20,21,22,23,24,25} (use each number individually).
          STATUS: Independently art PASS / STATIC-PASS at the heads captured. NATIVE-UNTESTED. Not merged or owner-playtested. Windows Workbench installation/native bridge capacity may differ from source; run the supported native admission procedure before treating any of these as accepted live levels.
                    BUNDLE_README_EOF
          test "$(find "$O/maps" -maxdepth 1 -mindepth 1 -type d | wc -l)" = 8
          test "$(find "$O/maps" -name 'setup*.json' -type f | wc -l)" = 8
          test "$(find "$O/maps" -name 'overview.png' -type f | wc -l)" = 8
          ( cd "$O"; find maps tools -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          du -sh "$O"
      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: cybersand-eight-original-landscapes-20261119
          path: out/CyberSand-Original-Landscapes-2026-11-19/
          if-no-files-found: error
          retention-days: 30

name: One-off exact-source original landscape visual gallery
on:
  push:
    branches:
      - artifact/original-landscapes-bundle-20261119
permissions:
  contents: read
jobs:
  gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch actual committed material-cell overview PNGs (not concept images)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request, hashlib, struct, time
          items=json.loads(r'''[{"pr":57,"sha":"6ef760b800402ff683aa72f315b6a107159b5f83","folder":"original-megastructure-wide-pilgrim-gait-sixleg-civic-engine-261120","title":"Pilgrim Gait"},{"pr":69,"sha":"7fc24855cf521c90bf67f4afb08685e490473201","folder":"original-racing-wide-tungsten-sawtooth-tramworks-261120","title":"Tungsten Sawtooth Tramworks"},{"pr":53,"sha":"fc27754defff1f8501b256543d658a83f992da62","folder":"original-racing-wide-kestrel-counterweight-works-261120","title":"Kestrel Counterweight Works"},{"pr":45,"sha":"7ce39e6eb6d701b515bd4f6b1ccea551bf467a2f","folder":"original-industrial-transit-wide-graven-keel-ship-tipper-261120","title":"Graven Keel"},{"pr":38,"sha":"46e047d46dc067f79da8907e5e91b224c9e8cc17","folder":"original-scifi-biomech-wide-nacre-spindle-court-261120","title":"Nacre Spindle Court"},{"pr":33,"sha":"0e872ce0987be7e6df047152beac470ba362c7c5","folder":"original-scifi-frontier-wide-peregrine-cleft-halcyon-drydock-261120","title":"Peregrine Cleft"},{"pr":73,"sha":"baec53549fc014f5af67e2a6e79201a7dd8134b9","folder":"original-scifi-frontier-wide-threnody-scar-foldwing-seedlift-261120","title":"Threnody Scar"},{"pr":64,"sha":"1202aea8d696e2bfecd7e4f3353c9738a9435858","folder":"original-scifi-frontier-wide-harrow-mere-spore-dam-261120","title":"Harrow Mere"},{"pr":61,"sha":"b3602ef5cbf5fbee3e1ddd729c4fc4b63fc970ea","folder":"original-industrial-transit-wide-kestrel-traverse-straddle-port-261120","title":"Kestrel Traverse"},{"pr":62,"sha":"dee9fb4c2325a4dea31435383c1f7305234cce49","folder":"original-racing-wide-lagrange-slipway-six-261120","title":"Lagrange Slipway Six"},{"pr":70,"sha":"485bdd45868e232161032bc823dbeab800d9b109","folder":"original-scifi-frontier-wide-sable-quoin-gravitic-core-261120","title":"Sable Quoin"},{"pr":65,"sha":"60ec2052b6f56a180f21e13b21b5c3b5214edb6f","folder":"original-racing-wide-serration-venturi-exchange-261120","title":"Serration Venturi"},{"pr":71,"sha":"e53a84ee829cf18a59221eade18ed7e24a3e0109","folder":"original-industrial-foundry-wide-anvilwake-twin-dock-electrosmelter-261120","title":"Anvilwake Twin-Dock"},{"pr":72,"sha":"76471e3f817e39880d88cdfa2896022c35893bd8","folder":"original-scifi-biomech-wide-asterion-packet-loom-261120","title":"Asterion Packet Loom"},{"pr":25,"sha":"9d38064137c1c3be1073d204967e658e8e2235a6","folder":"original-industrial-foundry-wide-long-pour-steelworks","title":"The Long Pour"},{"pr":22,"sha":"b0d1e5216aabb9b5e009e599ffbffcec6fd8a657","folder":"original-scifi-biomech-wide-graftloom-slipway-261119","title":"Graftloom Slipway"},{"pr":24,"sha":"04d47c9ae0c0de6132aa1b96fb0c082b7ef2da95","folder":"original-megastructure-wide-meridian-scar-261119","title":"The Meridian Scar"},{"pr":17,"sha":"189722d05743e81a8c10fe686daa96499ed6c5ae","folder":"original-racing-wide-thunderclap-switchyard-261118","title":"Thunderclap Switchyard"},{"pr":39,"sha":"99a54a6af0808f63758a15035065b11336f001f7","folder":"original-megastructure-wide-umbra-siphon-twin-horn-261120","title":"Umbra Siphon"}]''')
          out=pathlib.Path("gallery")
          out.mkdir(parents=True,exist_ok=True)
          records=[]
          for item in items:
              path=f"cybersand-canvases/2048x1024/{item['folder']}/overview.png"
              url=f"https://raw.githubusercontent.com/techrote/sandmapsreference/{item['sha']}/{path}"
              body=None
              for attempt in range(3):
                  try:
                      request=urllib.request.Request(url,headers={"User-Agent":"CyberSand-source-gallery/1.0"})
                      with urllib.request.urlopen(request,timeout=75) as response:
                          body=response.read()
                      break
                  except Exception:
                      if attempt==2: raise
                      time.sleep(attempt+1)
              assert body[:8]==bytes.fromhex("89504e470d0a1a0a"),(item['pr'],"not PNG")
              assert struct.unpack(">II",body[16:24])==(2048,1024),(item['pr'],"wrong size")
              name=f"{item['pr']:03d}-{item['folder']}.png"
              (out/name).write_bytes(body)
              records.append({"pr":item['pr'],"title":item['title'],"sha":item['sha'],"source_path":path,"file":name,"size_bytes":len(body),"sha256":hashlib.sha256(body).hexdigest(),"url":url})
              print(f"{item['pr']} {item['title']} {len(body)} bytes",flush=True)
          (out/"manifest.json").write_text(json.dumps(records,indent=2)+"\n",encoding="utf-8")
          assert len(records)==19
          PY
      - name: Publish untouched image archive
        uses: actions/upload-artifact@v4
        with:
          name: cybersand-original-map-gallery-20261120
          path: gallery/
          if-no-files-found: error
          retention-days: 30

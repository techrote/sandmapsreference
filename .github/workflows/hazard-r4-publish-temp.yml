name: One-shot R4 industrial-hazard original material publication
on:
  push:
    branches:
      - 'original/industrial-hazard-wide/pyrewater-ashlight-dual-261119'
    paths:
      - '.github/workflows/hazard-r4-publish-temp.yml'
permissions:
  contents: write
jobs:
  emit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild both complete indexed material-cell worlds from fixed seeds
        run: node tools/original-industrial-hazard-wide/build.cjs
      - name: Replay and independently requalify all published material cells
        run: |
          node tools/original-industrial-hazard-wide/build.cjs --verify
          node tools/original-industrial-hazard-wide/verify-independent.cjs
      - name: Commit exact generated worlds and remove one-shot workflow
        run: |
          rm .github/workflows/hazard-r4-publish-temp.yml
          git add -A .github/workflows/hazard-r4-publish-temp.yml
          git add -A cybersand-canvases/2048x1024/original-industrial-hazard-wide-pyrewater-quarantine-ring
          git add -A cybersand-canvases/2048x1024/original-industrial-hazard-wide-ashlight-counterflow-foundry
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'R4: publish requalified real-cell hazard maps and retire one-shot publisher'
          git push origin "HEAD:${GITHUB_REF_NAME}"

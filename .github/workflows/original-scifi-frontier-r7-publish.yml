name: TEMPORARY Sci-Fi Frontier R7 deterministic material publication
on:
  push:
    branches:
      - original/scifi-frontier-wide/morrow-array-split-phasewell-261119
    paths:
      - 'cybersand-canvases/2048x1024/original-scifi-frontier-wide-morrow-array-split-phasewell-261119/build.cjs'
      - 'cybersand-canvases/2048x1024/original-scifi-frontier-wide-morrow-array-split-phasewell-261119/repair-workrooms-r7.cjs'
      - '.github/workflows/original-scifi-frontier-r7-publish.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild full actual material cells, Setup-v2, indexed PNGs and receipt
        run: |
          set -euo pipefail
          D="cybersand-canvases/2048x1024/original-scifi-frontier-wide-morrow-array-split-phasewell-261119"
          node "$D/build.cjs" --verify
          git add "$D/setup-morrow-array.json" "$D/receipt.json" "$D/"*.png
          if git diff --cached --quiet; then
            echo "Outputs already exact: no write."
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Publish original Morrow R7 fully regenerated material plane and evidence"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

name: Original racing-wide exact-source build and independent static verification
on:
  push:
    branches:
      - original/racing-wide/thunderclap-switchyard-261118
    paths:
      - 'cybersand-canvases/2048x1024/original-racing-wide-thunderclap-switchyard-261118/build.cjs'
      - 'cybersand-canvases/2048x1024/original-racing-wide-thunderclap-switchyard-261118/verify-independent.cjs'
      - '.github/workflows/original-racing-wide.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build real material-cell JSON and PNG assets
        working-directory: cybersand-canvases/2048x1024/original-racing-wide-thunderclap-switchyard-261118
        run: node build.cjs
      - name: Verify reproducibility and independent whole-grid and PNG parity
        working-directory: cybersand-canvases/2048x1024/original-racing-wide-thunderclap-switchyard-261118
        run: |
          node build.cjs --verify
          node verify-independent.cjs
      - name: Publish verified generated assets to same creator branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cybersand-canvases/2048x1024/original-racing-wide-thunderclap-switchyard-261118/
          if ! git diff --cached --quiet; then
            git commit -m "R10: regenerate verified racing-wide material-cell setup and PNG evidence"
            git push origin HEAD:original/racing-wide/thunderclap-switchyard-261118
          fi

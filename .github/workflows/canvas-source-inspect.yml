name: Tall Canvas source and cell qualification
on:
  push:
    branches:
      - cybersand-canvas/1024x2048/techn-0034a-slate-shaft-20261117
    paths:
      - .github/workflows/canvas-source-inspect.yml
      - cybersand-canvases/1024x2048/techn-0034a-slate-shaft/build.py
permissions:
  contents: write
jobs:
  build-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: true
      - name: Build exact-source material-cell terrain
        shell: bash
        run: |
          python3 -m pip install --quiet Pillow numpy
          python3 cybersand-canvases/1024x2048/techn-0034a-slate-shaft/build.py
      - name: Source-matched build artifact commit
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cybersand-canvases/1024x2048/techn-0034a-slate-shaft/
          if git diff --cached --quiet; then
            echo "No generated differences"
          else
            git commit -m "Build exact CyberSand 1024x2048 source-matched canvas and evidence"
            git push
          fi

name: Kestrel original material-cell exact-source qualification
on:
  push:
    branches:
      - 'original/industrial-transit-wide/kestrel-traverse-straddle-port-261120'
  pull_request:
    paths:
      - 'cybersand-canvases/2048x1024/original-industrial-transit-wide-kestrel-traverse-straddle-port-261120/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact all material cells, rectangle replay, flight and images
        run: |
          cd cybersand-canvases/2048x1024/original-industrial-transit-wide-kestrel-traverse-straddle-port-261120
          node build.cjs
          git diff --exit-code -- setup-kestrel.json receipt.json overview.png '*-drydock.png' '*-gantry.png' '*-arch.png' '*-switchback.png' '*-dispatch.png' '*-gallery.png'

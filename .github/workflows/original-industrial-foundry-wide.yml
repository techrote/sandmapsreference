name: Original Industrial Foundry Wide R5 owned-branch artifact publisher
on:
  push:
    branches:
      - 'original/industrial-foundry-wide/long-pour-steelworks-261119'
permissions:
  contents: write
jobs:
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/original/industrial-foundry-wide/long-pour-steelworks-261119'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate original exact material-cell artifacts
        run: node tools/original-industrial-foundry-wide/build.cjs
      - name: Independently reproduce and audit material plane
        run: node tools/original-industrial-foundry-wide/verify-independent.cjs
      - name: Commit generated artifacts to this owned original branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cybersand-canvases/2048x1024/original-industrial-foundry-wide-long-pour-steelworks/
          if ! git diff --cached --quiet; then
            git commit -m 'art(foundry): publish R5 deterministic material grid and verified PNGs'
            git push origin HEAD:refs/heads/original/industrial-foundry-wide/long-pour-steelworks-261119
          fi

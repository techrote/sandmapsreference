name: Original Industrial Foundry Wide exact-artifact verification
on:
  push:
    branches:
      - 'original/industrial-foundry-wide/**'
  pull_request:
    paths:
      - 'tools/original-industrial-foundry-wide/**'
      - 'cybersand-canvases/2048x1024/original-industrial-foundry-wide-*/**'
      - '.github/workflows/original-industrial-foundry-wide.yml'
permissions:
  contents: read
jobs:
  verify-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/original-industrial-foundry-wide/build.cjs --verify
      - run: node tools/original-industrial-foundry-wide/verify-independent.cjs --verify
      - run: git diff --exit-code
  r2-one-shot-publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate genuine lane-only material-cell artifacts
        run: node tools/original-industrial-foundry-wide/build.cjs
      - name: Independent no-import complete replay, PNG CRC, per-pixel parity and clearance
        run: node tools/original-industrial-foundry-wide/verify-independent.cjs
      - name: Deterministic byte-for-byte validation
        run: |
          node tools/original-industrial-foundry-wide/build.cjs --verify
          node tools/original-industrial-foundry-wide/verify-independent.cjs --verify
      - name: Commit generated material outputs only to the triggering owned branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- cybersand-canvases/2048x1024/original-industrial-foundry-wide-long-pour-steelworks/
          if git diff --cached --quiet; then echo "No generated artifact changes"; exit 0; fi
          git commit -m "art(foundry): regenerate exact R2 material cells and independent evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"

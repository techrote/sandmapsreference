name: GOLDMAPS owner playable Windows delivery

on:
  push:
    branches:
      - delivery/goldmaps-owner-001-20261124
    paths:
      - .github/workflows/goldmaps-owner-delivery.yml
      - tools/goldmaps_owner/integration/qualification-request.v1.json

permissions:
  contents: read

# One explicitly requested campaign at a time. Documentation/source-only
# follow-ups do not rerun the native population or cancel another programme.
concurrency:
  group: goldmaps-owner-delivery-001
  cancel-in-progress: false

jobs:
  windows-owner-kit:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Preserve exact committed map and source bytes
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Check out the exact additive delivery source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/
            tools/goldmaps_owner/
            scripts/goldmaps_finalisation/
            docs/corpus/goldmaps-recovery-001/
            docs/corpus/goldmaps-finalisation-001/
            docs/corpus/goldmaps-owner-delivery-001/

      - name: Read only the accepted contemporary engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: techrote/cybersand
          ref: 00cdb02f103265b6dc5224c68283e9a0c8cb449f
          path: accepted-engine
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            godot/
            native/
            tools/
            third_party/
            .github/

      - name: Select Python for deterministic corpus and package tools
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install pinned static analysis dependencies
        shell: pwsh
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0 pillow==13.0.0 pyyaml==6.0.3
          if ($LASTEXITCODE -ne 0) { throw 'Pinned corpus dependencies unavailable' }

      - name: Verify hosted provider and bounded scheduling policy
        shell: pwsh
        run: |
          python accepted-engine/tools/ci/check_ci_provider_policy.py --root .
          if ($LASTEXITCODE -ne 0) { throw 'CI provider policy failed' }
          python accepted-engine/tools/ci/check_ci_scheduling_policy.py --root . --output "$env:RUNNER_TEMP/goldmaps-ci-scheduling.json"
          if ($LASTEXITCODE -ne 0) { throw 'CI scheduling policy failed' }
          $inventory = Get-Content "$env:RUNNER_TEMP/goldmaps-ci-scheduling.json" -Raw | ConvertFrom-Json
          if ($inventory.workflow_count -lt 1 -or -not ($inventory.workflows.file -contains '.github/workflows/goldmaps-owner-delivery.yml')) { throw 'Workflow policy scan did not inspect the actual delivery workflow' }

      - name: Build qualify archive and freshly extract the actual owner kit
        shell: pwsh
        env:
          GOLDMAPS_TEST_SOURCE_HEAD: ${{ github.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python tools/goldmaps_owner/integration/run_campaign.py --engine accepted-engine --out "$env:RUNNER_TEMP/goldmaps-owner-delivery" --source-head $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Owner delivery did not complete; preserve actual negative receipts' }

      - name: Publish actual playable ZIP and exact reconstruction fallback
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GOLDMAPS-Owner-Playable-Windows-${{ github.sha }}
          path: ${{ runner.temp }}/goldmaps-owner-delivery/artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Preserve all executed evidence including any failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GOLDMAPS-Owner-Windows-Evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/goldmaps-owner-delivery/evidence/**
            ${{ runner.temp }}/goldmaps-ci-scheduling.json
          if-no-files-found: warn
          compression-level: 6
          retention-days: 90
